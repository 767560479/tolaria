name: Release (Windows)

on:
  push:
    branches:
      - alpha
    tags:
      - "stable-v*"
    # No paths-ignore: tag-only pushes often have an empty commits list, and
    # path filters would skip stable promotions. Alpha docs-only pushes may
    # rebuild; that is acceptable for this fork.

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=4096
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  release-windows:
    name: Build and publish Windows NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow history is enough for the build. Alpha/stable sequencing must not
          # rely on local `git tag --list` here: fetch-tags + depth 1 can omit remote
          # tags, which reused alpha-v…0001 and overwrote an older Release's assets.
          fetch-depth: 1

      - name: Compute version
        id: ver
        shell: bash
        run: |
          python3 <<'PY' > version.env
          import os
          import re
          import subprocess
          from datetime import datetime, timedelta, timezone

          def lines(command: list[str]) -> list[str]:
              output = subprocess.check_output(command, text=True).strip()
              return [line for line in output.splitlines() if line]

          def remote_tags() -> dict[str, str]:
              """Map tag name -> peeled commit SHA via ls-remote (shallow-safe)."""
              tags: dict[str, str] = {}
              peeled: dict[str, str] = {}
              for line in lines(["git", "ls-remote", "--tags", "origin"]):
                  sha, ref = line.split("\t", 1)
                  if not ref.startswith("refs/tags/"):
                      continue
                  name = ref.removeprefix("refs/tags/")
                  if name.endswith("^{}"):
                      peeled[name[:-3]] = sha
                  else:
                      tags[name] = sha
              tags.update(peeled)
              return tags

          ref = os.environ.get("GITHUB_REF", "")
          stable_tag_pattern = re.compile(r"^stable-v(\d{4}\.\d{1,2}\.\d{1,2})$")
          alpha_pattern = re.compile(r"^alpha-v(\d{4}\.\d{1,2}\.\d{1,2})-alpha\.(\d+)$")

          if ref.startswith("refs/tags/"):
              tag = ref.removeprefix("refs/tags/")
              match = stable_tag_pattern.fullmatch(tag)
              if not match:
                  raise SystemExit(f"Unsupported stable tag: {tag}")
              version = match.group(1)
              year, month, day = (int(part) for part in version.split("."))
              display_version = f"{year}.{month}.{day}"
              prerelease = "false"
              channel = "stable"
          else:
              head = lines(["git", "rev-parse", "HEAD"])[0]
              remote = remote_tags()
              existing = sorted(
                  t for t, sha in remote.items()
                  if t.startswith("alpha-v") and sha == head
              )
              if existing:
                  tag = existing[0]
                  match = alpha_pattern.fullmatch(tag)
                  version = (
                      f"{match.group(1)}-alpha.{int(match.group(2))}"
                      if match
                      else tag.removeprefix("alpha-v")
                  )
              else:
                  today = datetime.now(timezone.utc).date()
                  calendar_date = today
                  stable_for_day = f"stable-v{today.year}.{today.month}.{today.day}"
                  if stable_for_day in remote:
                      calendar_date = today + timedelta(days=1)
                  calendar = f"{calendar_date.year}.{calendar_date.month}.{calendar_date.day}"
                  day_prefix = f"alpha-v{calendar}-alpha."
                  used = []
                  for name in remote:
                      match = alpha_pattern.fullmatch(name)
                      if match and match.group(1) == calendar:
                          used.append(int(match.group(2)))
                  sequence = (max(used) if used else 0) + 1
                  version = f"{calendar}-alpha.{sequence}"
                  tag = f"{day_prefix}{sequence:04d}"
                  if tag in remote:
                      raise SystemExit(
                          f"Computed alpha tag already exists on remote: {tag} -> {remote[tag]}"
                      )

              display_match = re.fullmatch(r"(\d{4})\.(\d{1,2})\.(\d{1,2})-alpha\.(\d+)", version)
              display_version = (
                  f"Alpha {int(display_match.group(1))}.{int(display_match.group(2))}."
                  f"{int(display_match.group(3))}.{int(display_match.group(4))}"
                  if display_match
                  else version
              )
              prerelease = "true"
              channel = "alpha"

          print(f"version={version}")
          print(f"display_version={display_version}")
          print(f"tag={tag}")
          print(f"prerelease={prerelease}")
          print(f"channel={channel}")
          PY
          cat version.env >> "$GITHUB_OUTPUT"
          echo "### Windows release: \`$(grep '^display_version=' version.env | cut -d= -f2-)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: windows-nsis-release
          cache-on-failure: true

      - name: Resolve Tauri tools cache path
        id: tauri-tools
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LOCALAPPDATA)) {
            throw "LOCALAPPDATA is required for Tauri NSIS tool cache."
          }
          "path=$($env:LOCALAPPDATA)\tauri" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache Tauri NSIS tools
        uses: actions/cache@v4
        with:
          path: ${{ steps.tauri-tools.outputs.path }}
          key: tauri-nsis-3.11-utils-v0.5.3-win

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prefetch NSIS tools
        shell: pwsh
        run: ./.github/scripts/prefetch-tauri-nsis.ps1

      - name: Stamp version
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $tauri = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $tauri.version = $version
          $tauri | ConvertTo-Json -Depth 100 | Set-Content "src-tauri/tauri.conf.json"
          (Get-Content "src-tauri/Cargo.toml") `
            -replace '^version = ".*"$', "version = `"$version`"" `
            | Set-Content "src-tauri/Cargo.toml"

      - name: Build Windows NSIS installer (unsigned)
        shell: pwsh
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Collect installer
        id: artifact
        shell: bash
        run: |
          shopt -s nullglob
          installers=(src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "::error::No NSIS setup.exe produced."
            exit 1
          fi
          installer="${installers[0]}"
          if [[ "$(basename "$installer")" != *"${{ steps.ver.outputs.version }}"* ]]; then
            echo "::error::Installer name does not include version: $(basename "$installer")"
            exit 1
          fi
          echo "path=$installer" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$installer")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Tolaria ${{ steps.ver.outputs.display_version }} (Windows)
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: ${{ steps.artifact.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
